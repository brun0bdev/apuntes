    <script>
      // Anti-FOUC: fija el tema antes de que se cargue el bundle.
      // Prioridad: localStorage('theme') → prefers-color-scheme → light.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {
          /* localStorage bloqueado: se cae a prefers-color-scheme */
        }
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* Pinta el canvas del tema oscuro antes de que llegue el CSS del bundle
         para evitar el destello blanco (mismo valor que --canvas en tokens.css). */
      html[data-theme='dark'] {
        background: #000000;
      }
    </style>

<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>BrunoB</title>
		<meta name="description" content="Selector de proyectos de BrunoB." />
		<meta name="author" content="Bruno B." />
		<meta name="theme-color" content="#313338" media="(prefers-color-scheme: dark)">
		<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">

		<style>
			:root {
				--bg: #f2f3f5;
				--fg: #1e1f22;
				--card: #ffffff;
				--muted: #4e5058;
				--border: #e3e5e8;
				--shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
			}
			:root.dark {
				--bg: #313338;
				--fg: #dbdee1;
				--card: #2b2d31;
				--muted: #b5bac1;
				--border: #3f4147;
				--shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #313338;
					--fg: #dbdee1;
					--card: #2b2d31;
					--muted: #b5bac1;
					--border: #3f4147;
					--shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
				}
			}

			* { box-sizing: border-box; }
			html, body { height: 100%; }
			body {
				margin: 0;
				font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
				background: var(--bg);
				color: var(--fg);
				display: flex;
				flex-direction: column;
			}
			.container {
				width: 100%;
				max-width: 720px;
				margin: auto;
				padding: 24px;
			}
			.projects { display: grid; gap: 12px; }
			a.project {
				display: flex; align-items: center; justify-content: space-between; gap: 12px;
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 16px 18px;
				box-shadow: var(--shadow);
				text-decoration: none;
				color: inherit;
			}
			a.project:hover { transform: translateY(-2px); transition: 150ms; border-color: var(--muted); }
			.project h3 { margin: 0; font-size: 16px; }
			.project .arrow { color: var(--muted); }
			/* Footer "Made by BrunoB" — mismo formato que el de Scouting LEC 2026 */
			footer.site {
				margin-top: auto;
				border-top: 1px solid var(--border);
				padding: 20px 24px;
				text-align: center;
				font-size: 12px;
				color: var(--muted);
			}
			footer.site a {
				color: var(--fg);
				font-weight: 700;
				text-decoration: none;
			}
			footer.site a:hover {
				text-decoration: underline;
				text-decoration-color: #1c69d4;
				text-underline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="projects">
				<a class="project" href="lec/index.html">
					<h3>Scouting LEC 2026</h3>
				</a>
				<a class="project" href="lecVersus/index.html">
					<h3>LEC Versus 2026</h3>
				</a>
			</div>
		</div>
		<footer class="site">
			<a href="https://brunob.dev" target="_blank" rel="noreferrer">Made by BrunoB</a>
		</footer>
	</body>
	</html>
